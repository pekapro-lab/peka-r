name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS deps
        run: npm ci

      - name: Build web (relative base for Capacitor)
        run: |
          VITE_BASE=./ npx vite build --outDir www
          npx cap sync android

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.PEKAR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PEKAR_KEY_PASSWORD }}
        run: |
          PASS="${STORE_PASSWORD:-pekaR-release-2026}"
          KEYPASS="${KEY_PASSWORD:-pekaR-release-2026}"
          printf '%s\n' \
            "storeFile=keystore/peka-r-release.jks" \
            "storePassword=$PASS" \
            "keyAlias=pekar" \
            "keyPassword=$KEYPASS" \
            > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        id: prep
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="1.0.0-dev"; fi
          OUT="Peka-R-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peka-R-apk
          path: |
            ${{ steps.prep.outputs.apk }}
            ${{ steps.prep.outputs.apk }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="${{ steps.prep.outputs.apk }}"
          VER="${{ steps.prep.outputs.version }}"
          SUM=$(cut -d' ' -f1 "$APK.sha256")
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Peka-R $VER" \
            --notes "$(cat <<NOTES
          APK de Android de **Peka-R** (Capacitor). Funciona sin conexión.

          - Paquete: \`com.pekapro.pekar\`
          - Orientación horizontal, pantalla completa
          - Android 7 (API 24) o superior

          **Instalar:** descarga el APK → permite apps desconocidas → Instalar.
          Si Play Protect avisa, elige *Instalar de todas formas* (no está en Play Store).

          SHA-256: \`$SUM\`
          NOTES
          )"
